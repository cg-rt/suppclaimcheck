# Commit checks for every committer, inside Claude Code or not (P0.2, D-032).
# Set up once per clone: `uv sync`, then `uv run pre-commit install`.
# Hook repos are pinned to commit SHAs (as D-023 does for Actions); the comment names the tag.
minimum_pre_commit_version: "4.6.2"
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 44b5042edab9382aba712eed4f9c7bab7a3d6a3e  # frozen: v0.17.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer

  # Blocks private details and anything under private/ (D-031). Skips itself where private/ is absent, such as CI.
  - repo: local
    hooks:
      - id: check-private-words
        name: private-words check
        entry: node tools/check-private-words.mjs --staged
        language: system
        pass_filenames: false
        always_run: true
