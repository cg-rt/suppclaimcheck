# Commit checks for every committer, inside Claude Code or not (P0.2, D-032).
# Set up once per clone: `uv sync`, then `uv run pre-commit install`.
# Hook repos are pinned to commit SHAs (as D-023 does for Actions); the comment names the tag.
minimum_pre_commit_version: "4.6.2"
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # Recorded HTTP responses and vendored minified scripts stay byte for byte.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(tests/fixtures/.*/literature/|services/web/src/scc_web/static/js/)
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures/.*/literature/|services/web/src/scc_web/static/js/)

  # Blocks private details and anything under private/ (D-031). Skips itself where private/ is absent, such as CI.
  - repo: local
    hooks:
      - id: check-private-words
        name: private-words check
        entry: node tools/check-private-words.mjs --staged
        language: system
        pass_filenames: false
        always_run: true

      # The README diagram and the viewer data are generated from the map (P0.4).
      - id: map-build-check
        name: generated map files are up to date
        entry: uv run python tools/map_build.py --check
        language: system
        pass_filenames: false
        files: ^(docs/architecture/architecture\.yaml|README\.md|docs/architecture/viewer/map-data\.js|tools/map_build\.py)$
