secrets:
  - id: gcp-service-account
    paths:
      - "/app/.venv/lib/python3.14/site-packages/anthropic/**"
    statement: >
      Not a secret: the Anthropic SDK (1.15.0, gateway only) documents agent identities with the example
      {"type": "service_account"} in docstrings, which matches the rule for the start of a Google key file.
      Only the SDK's own files are excused, so a real key file anywhere else still fails the release (D-056).
      Check again when the SDK is upgraded.
