# Release (P1.11, D-022, D-034). A tag vX.Y.Z builds every image at that one app version, scans it with
# Trivy, pushes it to GHCR and attaches a build provenance attestation. Every action is pinned to a full
# commit SHA; the comment names the tag (D-023). No third-party build actions: plain docker commands.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: tag matches VERSION
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match VERSION (${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  image:
    name: image ${{ matrix.module }}
    needs: check-version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write       # push to GHCR
      id-token: write       # sign the attestation
      attestations: write   # store the attestation
    strategy:
      fail-fast: true
      matrix:
        include:
          - {module: web, context: ".", dockerfile: services/web/Dockerfile}
          - {module: core, context: ".", dockerfile: services/core/Dockerfile}
          - {module: gateway, context: ".", dockerfile: services/gateway/Dockerfile}
          # gosu only drops root privileges at container start; it makes no network or TLS calls, so its
          # old Go standard library findings don't apply (the upstream image's own stance).
          - {module: postgres, context: services/postgres, dockerfile: services/postgres/Dockerfile, skip: usr/local/bin/gosu}
          - {module: edge, context: services/edge, dockerfile: services/edge/Dockerfile}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/suppclaimcheck-${{ matrix.module }}
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          docker build --pull \
            --file "${{ matrix.dockerfile }}" \
            --build-arg "GIT_SHA=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${VERSION}" \
            "${{ matrix.context }}"

      # The release binary, checked against its published SHA-256, instead of the Trivy action (D-023).
      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.75.0
          SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  trivy.tar.gz" | sha256sum --check
          tar -xzf trivy.tar.gz trivy

      # Fails the release on a fixable critical or high vulnerability. Unfixed ones can't be acted on yet;
      # accepted ones are in .trivyignore.yaml, each with a reason and an expiry date.
      - name: Scan
        env:
          SKIP_FILES: ${{ matrix.skip }}
        run: |
          ./trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress \
            --ignorefile .trivyignore.yaml ${SKIP_FILES:+--skip-files "$SKIP_FILES"} "${IMAGE}:${VERSION}"

      - name: Push
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${VERSION}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}" | cut -d@ -f2)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
