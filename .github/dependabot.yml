# Dependabot version updates (P0.3, D-023). Security updates are on in the repo settings and skip the cooldown.
# The 14-day cooldown matches the rule to prefer releases at least two weeks old (AGENTS.md section 7).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"

  # Module Dockerfiles arrive in Phase 1 (P1.01); until then this finds nothing to update.
  - package-ecosystem: docker
    directories:
      - /services/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
