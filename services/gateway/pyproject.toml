[project]
name = "scc-gateway"
version = "1.0.0"
description = "SuppClaimCheck gateway module"
requires-python = ">=3.14"
dependencies = [
    "anthropic==1.15.0",
    # The page reader (P3.12, D-055) connects through its own network backend; httpx already brings it.
    "httpcore==1.0.9",
    "psycopg-pool==3.3.3",
    "scc-common",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
scc-common = { workspace = true }
