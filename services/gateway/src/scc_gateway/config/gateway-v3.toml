# Gateway config v3 (P3.12, D-055). Versioned config, never constants in code (AGENTS.md section 8).
# Changes from v2: [pages], the limits for reading a page a user links to, and the page codes that
# don't alert (a user's link, not something to act on).
version = "gateway-v3"

[budget]
# Monthly hard caps per lane, in EUR (D-021). New LLM calls are refused once spent + this call's
# worst-case cost would pass the cap. Provider console limits are a second safety net.
live_monthly_cap_eur = 15.0
eval_monthly_cap_eur = 5.0
# USD to EUR. Deliberately pessimistic (1 USD is less than 1 EUR), so spend is over-counted, never under.
eur_per_usd = 1.0
# For the worst-case estimate before a call: characters per input token, rounded down to over-count.
chars_per_token_estimate = 3
# Warnings (P3.04): when a lane's spend this month passes one of these shares of its cap, one Telegram
# alert per level and month, and a banner in admin until the month ends.
warn_at = [0.5, 0.8]
# New checks are refused while less than this is left in the live lane: more than one check can cost
# (about EUR 0.003 each in the evals), so a check that starts can finish.
new_check_reserve_eur = 0.05

# USD per million tokens. Claude Haiku 5.5: 0.10 / 0.50 for prompts up to 100K tokens, 0.50 / 2.50 beyond.
[prices."claude-haiku-5-5"]
input_usd_per_mtok = 0.10
output_usd_per_mtok = 0.50
long_prompt_threshold_tokens = 100_000
long_input_usd_per_mtok = 0.50
long_output_usd_per_mtok = 2.50

[prices."claude-sonnet-5-5"]
input_usd_per_mtok = 2.00
output_usd_per_mtok = 10.00

[llm]
timeout_s = 90
max_attempts = 3
backoff_base_s = 1.0
backoff_max_s = 20.0

[literature]
tool = "suppclaimcheck"
email = "contact@suppclaimcheck.com"
# NCBI allows 10 requests/s with an API key and 3 without; we stay below both (D-017).
ncbi_requests_per_second_with_key = 8
ncbi_requests_per_second_without_key = 3
timeout_s = 20
max_attempts = 3
backoff_base_s = 1.0
backoff_max_s = 10.0
# Licences that allow text mining for this non-commercial project (D-017), as Europe PMC writes them.
licence_allowlist = ["cc0", "cc by", "cc by-sa", "cc by-nd", "cc by-nc", "cc by-nc-sa", "cc by-nc-nd"]

[quotas]
# Checks per account per UTC day (P3.04), counted from extraction calls in the live lane. 0 turns it off.
checks_per_user_per_day = 25
# Web user IDs the quota doesn't apply to, such as the owner's own account while testing.
exempt_user_ids = []

[idempotency]
# A call sent again with the same Idempotency-Key gets the stored answer, not a new charge (P3.05).
# A reserved call older than this is taken as abandoned (its caller died) and its key is free again.
stale_after_minutes = 10
# Stored answers can hold the user's claim, so they are deleted after this many days.
output_retention_days = 7

[alerts]
# Telegram alerts (P1.14, D-024). A repeat of the same event and code inside this window is held back.
dedupe_minutes = 60
# Job failures that are the user's input or already alerted elsewhere, not something to act on.
# Page codes (P3.12) are about the link a user gave, except url_blocked: an address inside a private
# network may be someone probing, so that one alerts.
quiet_job_failure_codes = [
    "no_claim", "budget_cap_reached",
    "url_invalid", "robots_disallowed", "ai_disallowed", "not_html", "too_large", "no_text",
    "page_not_found", "site_refused", "page_unavailable", "page_timeout",
]
timeout_s = 10
max_attempts = 3
backoff_base_s = 1.0
backoff_max_s = 8.0

[retention]
# Privacy (P3.06, docs/PRIVACY.md). Cost rows are kept for the budget's record, but their link to an
# account is removed after this many days: the same period core keeps the checks themselves.
user_link_days = 180
# How often the purge runs inside the gateway (stored answers past [idempotency], old links, and the
# calls of deleted accounts that finished after the deletion).
purge_every_minutes = 60

[pages]
# Reading a page a user links to (P3.12, D-055, scc_gateway/pages.py). Every address is checked before
# each connection; these are the limits and manners.
# Sent with every request. The page it links to says what the reader does and how to block it.
user_agent = "SuppClaimCheck (+https://suppclaimcheck.com/reader)"
# The name robots.txt rules and robots meta tags use for us (RFC 9309), compared case-insensitively.
robots_token = "SuppClaimCheck"
# The whole read, robots.txt and redirects included.
timeout_s = 10
# The page after decompression; more is refused.
max_bytes = 2_000_000
max_redirects = 5
# Only the usual web ports.
ports = [80, 443]
# Sites never read, with every name under them ("example.com" covers "news.example.com"), for an owner
# who asks us to stay away faster than robots.txt can say it (RB-17). Lowercase host names.
blocked_hosts = []
# RFC 9309 asks crawlers to read at least 500 KiB of robots.txt; the rest is ignored.
robots_max_bytes = 512_000
# A site's robots.txt is reused this long (RFC 9309: no more than 24 hours).
robots_cache_minutes = 60
# At most one request to a site this often, across all checks.
min_interval_s = 1.0
# Less readable text than this means the page is empty to us (a login wall, a JavaScript-only page).
min_text_chars = 200
# The text returned to core, cut at a paragraph. Core decides how much of it the model reads.
max_text_chars = 100_000
