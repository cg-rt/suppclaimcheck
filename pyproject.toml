# Developer tools for the whole repo (D-032), and the root of the uv workspace that holds every module (D-037).
# `uv sync --all-packages` installs the modules too, for tests.
[project]
name = "suppclaimcheck-dev"
version = "0.0.0"
description = "Repo-wide developer tools for SuppClaimCheck"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "axe-playwright-python==0.1.8",
    "playwright==1.64.1",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
]

[tool.uv.workspace]
members = ["libs/common", "services/web", "services/core", "services/gateway"]

[tool.ruff]
# Scripts in tools/ import each other as top-level modules.
src = [".", "tools"]

[tool.pytest.ini_options]
testpaths = ["tools/tests", "libs/common/tests", "services/web/tests", "services/core/tests", "services/gateway/tests", "tests"]
pythonpath = ["tools", "."]  # "." so any test can import tests.helpers and tests.web_samples
# Several modules have a tests/ folder; importlib mode keeps same-named test files apart.
addopts = ["--import-mode=importlib"]

[tool.uv]
package = false
# Only releases at least two weeks old, indirect dependencies included (AGENTS.md section 7).
exclude-newer = "14 days"

# Security fixes newer than two weeks (D-041): a fixed cutoff just after the patched release.
# A fixed date gets stricter than "14 days" once it is two weeks old, so delete each entry then.
[tool.uv.exclude-newer-package]
virtualenv = "2026-10-23T00:00:00Z"  # 21.14.13 fixes GHSA-cx6f-vjhg-g3cc (and 21.14.9 GHSA-vxj4-q4g9-crj7); delete on 2026-11-06
fastembed = "2026-10-25T00:00:00Z"   # 0.9.1 allows Pillow 13.0.0, which fixes GHSA-5x8w-8jj5-q52h, GHSA-v9pv-5gc8-w2m6 and 39 more (in core); delete on 2026-11-07

[tool.ruff.lint.isort]
known-first-party = ["scc_common", "scc_web", "scc_core", "scc_gateway"]
