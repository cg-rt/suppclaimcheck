[project]
name = "scc-common"
version = "0.1.0"
description = "Shared logging, correlation IDs, health endpoints and database helpers for SuppClaimCheck modules"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.4",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
